name: Verify ContentHub 1.3.4 public bytes
on:
  push:
    branches:
      - 'release/contenthub-v1.3.4-public-verify-334426d584d444a3b405cd034519c84a'
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify public release asset bytes without credentials
        shell: bash
        run: |
          python3 - <<'PY'

          import concurrent.futures,gzip,hashlib,io,json,os,sys,tempfile,time,urllib.error,urllib.parse,urllib.request,uuid,base64
          from pathlib import Path
          encoded=''
          raw=gzip.decompress(base64.b64decode(encoded))
          plan=json.loads(raw)
          prefix=f'https://github.com/{plan["repository"]}/releases/download/{plan["tag"]}/'
          class Redirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,req,fp,code,msg,headers,url):
            loc=urllib.parse.urlsplit(url)
            if loc.scheme!='https' or loc.hostname not in ('github.com','release-assets.githubusercontent.com','objects.githubusercontent.com'):raise ValueError('Unexpected redirect')
            return super().redirect_request(req,fp,code,msg,headers,url)
          def get(row,out=None):
           amount=row['bytes'] if out else row['range_bytes']
           url=prefix+urllib.parse.quote(row['name'],safe='')
           for attempt in range(5):
            try:
             hdr={'User-Agent':'ContentHub-Public-Independent-Verification','Cache-Control':'no-cache'}
             if out is None:hdr['Range']=f'bytes=0-{amount-1}'
             if attempt:url=prefix+urllib.parse.quote(row['name'],safe='')+'?contenthub_observation='+uuid.uuid4().hex
             q=urllib.request.Request(url,headers=hdr)
             digest=hashlib.sha256();seen=0
             with urllib.request.build_opener(Redirect()).open(q,timeout=50) as src:
              if out:
               with out.open('wb') as f:
                while block:=src.read(min(1024*1024,amount-seen+1)):
                 seen+=len(block)
                 if seen>amount:raise ValueError('Asset longer than manifest')
                 digest.update(block);f.write(block)
              else:
               while seen<amount and (block:=src.read(amount-seen)):digest.update(block);seen+=len(block)
             if seen<amount:raise OSError('Short download')
             if seen!=amount or digest.hexdigest()!=row['sha256' if out else 'range_sha256']:raise ValueError('Public bytes differ: '+row['name'])
             return
            except (OSError,urllib.error.URLError) as e:
             if isinstance(e,urllib.error.HTTPError) and e.code not in (403,408,429,500,502,503,504):raise
             if attempt==4:raise RuntimeError(row['name']+': '+type(e).__name__+' '+str(getattr(e,'code',''))) from None
             time.sleep(1+attempt)
          with tempfile.TemporaryDirectory() as temporary, concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
           folder=Path(temporary)
           all_rows={r['name']:r for r in plan['assets']}
           parts=[all_rows[n] for n in plan['part_names']]
           def part(row):get(row,folder/row['name']);return row['name']
           files=list(pool.map(part,parts))
           zip_hash=hashlib.sha256();zip_bytes=0
           for name in files:
            with (folder/name).open('rb') as stream:
             while block:=stream.read(1024*1024):zip_hash.update(block);zip_bytes+=len(block)
           if zip_bytes!=plan['package']['bytes'] or zip_hash.hexdigest()!=plan['package']['sha256']:raise ValueError('Signed ZIP could not be reconstructed')
           def range_row(row):
            get(row)
            return {'name':row['name'],'range_bytes':row['range_bytes'],'native_sha256':row['sha256']}
           ranges=list(pool.map(range_row,plan['assets']))
           proof={'ok':True,'run_id':int(os.environ['GITHUB_RUN_ID']),'head_sha':os.environ['GITHUB_SHA'],'plan_sha256':hashlib.sha256(raw).hexdigest(),'parts_downloaded':len(parts),'release_id':plan['release_id'],'tag':plan['tag'],'commit':plan['commit'],'anonymous_attachment_ranges':ranges,'packages':[plan['package']],'anonymous_parts_source':'public-release-assets','auth_headers_sent':False}
           print('CONTENTHUB_PUBLIC_PROOF_V134 '+json.dumps(proof,separators=(',',':')),flush=True)
          PY
