name: ContentHub 1.3.0 verified artifacts
on:
  push:
    branches: ['release/contenthub-v1.3.0-artifacts-20261104']
permissions:
  contents: write
concurrency:
  group: contenthub-v130-artifacts
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'ASK-022/video-copy-studio-skill' && startsWith(github.event.head_commit.message, 'Arm verified ContentHub 1.3.0 artifact assembly 9a0a078348614f08bef5d6d0d26e565c')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CONTENTHUB_PLAN_SHA: 'eaeba5149681fde8f918c90f5c19e7274a9d5533c3b6dc9893ab2a309af33834'
      CONTENTHUB_RUNNER_SHA: 'dc6d03c70c3fdf178bbac3e96618373ada72842ba2e74ba29144a5cd1d7b3889'
    steps:
      - name: Verify and assemble exact public software artifacts
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 "https://raw.githubusercontent.com/ASK-022/video-copy-studio-skill/${{ github.sha }}/releases/contenthub/staging/1.3.0/runner.py" -o /tmp/contenthub-assembler.py
          echo "$CONTENTHUB_RUNNER_SHA  /tmp/contenthub-assembler.py" | sha256sum --check
          python3 /tmp/contenthub-assembler.py
