    steps:
      - name: Verify and assemble the exact approved public software
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 "https://raw.githubusercontent.com/ASK-022/video-copy-studio-skill/${{ github.sha }}/releases/contenthub/staging/1.3.4/168ac8ce5f364ab68604321fc0a59fdf/runner.py" -o /tmp/contenthub-v134-assembler.py
          echo "$CONTENTHUB_RUNNER_SHA  /tmp/contenthub-v134-assembler.py" | sha256sum --check
